# One-command local stack: PostgreSQL (data) + Metabase (visualization)
#   docker compose up -d   ->  Metabase on http://localhost:3000
services:
  postgres:
    image: postgres:16
    container_name: interview-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: metabase
      POSTGRES_DB: interview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.65.4
    container_name: interview-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - mbdata:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mbdata:
